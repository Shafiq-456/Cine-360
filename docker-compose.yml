services:
  db: {image: "postgres:16", environment: {POSTGRES_PASSWORD: cine, POSTGRES_DB: cine}}
  redis: {image: "redis:7"}
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./backend:/app"]
    environment: {DATABASE_URL: "postgresql+psycopg2://postgres:cine@db/cine", REDIS_URL: "redis://redis:6379/0"}
    command: sh -c "pip install -q -r requirements.txt psycopg2-binary && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on: [db, redis]
